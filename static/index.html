async function job(id){const j=await api('/api/jobs/'+id),have=Object.keys(j.data),S=j.stage,fl=j.findings;
 const all={request:'Customer request',proforma:'Proforma',work:'Work instruction',losses:'Losses datasheet',resistance:'Resistance log',noload:'No-load log',routine:'Routine tests',sc:'Short-circuit log',temp:'Temperature rise log',pressure:'Pressure and leakage log'};
 const c=x=>fl.filter(f=>f.level==x).length,drop=t=>`<div class="drop" id="dz">${t}<input type="file" id="fi" accept="${ACC}" hidden></div>`,rp=(j.reports||[])[0];
 const nx=S==0?['Add your lab log sheets','Import the test data from a spreadsheet, CSV file or database export, or attach the scanned sheets. Missing sources are listed on the right.',drop('Drop a .csv, .xlsx, .json or SQLite .db data file, or a scanned sheet (.pdf, image), or click to choose')]

 :S==3?['Review and approve','Check the preview below, then approve to release it for the customer.',`<div style="display:flex;gap:10px;flex-wrap:wrap"><input class="in" id="nm" placeholder="Your name" style="width:200px"><button class="btn lg" id="ap">Approve and release</button></div>`]
 :['Released',`Approved by ${esc(j.approver)}. Download or print the final report.`,`<a class="btn lg" href="/api/jobs/${id}/report.pdf?dl=1">Download PDF</a>`];
 $('#app').innerHTML=`<button class="back" onclick="go('workflow')">&larr; Report Workflow</button>`+head(j.series,`${esc(j.customer)}, ${esc(j.rating)} (sample ${j.sample})`,badge(j)+`<button class="btn g" onclick="editJob(${id})">Edit details</button><button class="btn g" style="color:var(--er)" onclick="delJob(${id},1)">Delete record</button>`)+
 `<div class="card"><div class="steps">${['Request','Import','Check','Report','Approve'].map((n,i)=>`<div class="step ${i<S?'done':i==S?'cur':''}"><u>${i<S?'&#10003;':i+1}</u>${n}</div>`).join('')}</div></div>

  <br><button class="btn g" style="width:100%;justify-content:center" onclick="pick(ACC,f=>sendFile(${id},f))">Import data file or scan</button><p class="note">Download this job's data: <a class="lk" style="padding:0" href="/api/jobs/${id}/export/csv">CSV</a><a class="lk" href="/api/jobs/${id}/export/xlsx">Excel</a><a class="lk" href="/api/jobs/${id}/export/sqlite">Database</a><a class="lk" href="/api/jobs/${id}/export/json">JSON</a><br>Blank layout: <a class="lk" style="padding:0" href="/api/template/csv">CSV template</a><a class="lk" href="/api/template/xlsx">Excel template</a></p>${S>=1?`<br><button class="btn g" style="width:100%;justify-content:center" onclick="act('validate','Checks complete')">Run checks again</button>`:''}</div>
 <div class="card"><h2>Source documents (${j.sources.length})</h2>${j.sources.map(s=>`<div class="src"><span><a class="lk" style="padding:0" href="/api/sources/${s.id}" target="_blank" title="SHA-256 ${s.sha256}">${esc(s.filename)}</a></span><span style="white-space:nowrap"><button class="lk" onclick="readAI(${id},${s.id},this.dataset.fn)" data-fn="${esc(s.filename)}">Read with AI</button><button class="lk d" onclick="delSrc(${id},${s.id})">Remove</button></span></div>`).join('')||'<p class="note" style="margin:0">Attach the scanned or photographed sheets (PDF or image). They are kept with the record as evidence and can be read with AI.</p>'}</div>
  <div class="card"><h2>History</h2><div class="tl">${j.audit.slice().reverse().map(a=>`<div>${esc(a.event)}<span>${a.at.replace('T',' ')}</span></div>`).join('')}</div></div></div></div>`;
 const dz=$('#dz');if(dz){const fi=$('#fi'),up=f=>sendFile(id,f);
  dz.onclick=()=>fi.click();fi.onchange=()=>up(fi.files[0]);dz.ondragover=e=>{e.preventDefault();dz.classList.add('h')};dz.ondragleave=()=>dz.classList.remove('h');dz.ondrop=e=>{e.preventDefault();up(e.dataTransfer.files[0])}}

function modal(h){closeModal();const o=document.createElement('div');o.className='ov';o.id='ov';o.innerHTML=`<div class="md" role="dialog" aria-modal="true">${h}</div>`;o.onclick=e=>{if(e.target==o)closeModal()};document.body.append(o)}
function closeModal(){const o=$('#ov');if(o)o.remove()}addEventListener('keydown',e=>{if(e.key=='Escape')closeModal()});
async function editJob(id){const j=await api('/api/jobs/'+id),r=j.data.request||{},v={series:j.series,sample:j.sample,customer:j.customer,rating:j.rating,address:r.address,serial:r.serial,tests:r.tests,criteria:r.criteria,witness:r.witness,conformity:r.conformity};

 modal(`<h2>Edit record</h2><div class="form">${Object.keys(L).map(k=>`<div class="${k=='address'?'w':''}"><label for="e_${k}">${L[k]}</label><input id="e_${k}" value="${esc(v[k])}"></div>`).join('')}</div>${j.stage>=3?`<p style="font-size:14px;margin-top:14px">This report is already generated. Saving updates it${j.stage==4?' and sends it back for re-approval':''}.</p>`:''}<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px"><button class="btn g" onclick="closeModal()">Cancel</button><button class="btn" id="es">Save changes</button></div>`);

async function delJob(id,back){const j=await api('/api/jobs/'+id);modal(`<h2>Delete this record?</h2><p><b>${esc(j.series)}</b> (${esc(j.customer)}) will be permanently removed with its imported data, generated report and history. This cannot be undone.</p><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px"><button class="btn g" onclick="closeModal()">Cancel</button><button class="btn d" id="dl">Delete record</button></div>`);
 $('#dl').onclick=async()=>{try{await api('/api/jobs/'+id,undefined,'DELETE');closeModal();toast('Record deleted');back?go('records'):route()}catch(e){toast(e,1)}}}

 $('#dr').onclick=async()=>{try{await api(`/api/jobs/${id}/discard`,{});closeModal();toast('Report deleted');route()}catch(e){toast(e,1)}}}

route();
