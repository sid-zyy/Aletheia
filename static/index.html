function lineChart(pts,lim){const W=560,H=230,L=44,R=14,Tp=16,B=30,xs=pts.map(p=>p.x),x0=Math.min(...xs),x1=Math.max(...xs),ym=Math.ceil(Math.max(lim*1.1,...pts.map(p=>p.y))/10)*10,sx=x=>L+(x-x0)/((x1-x0)||1)*(W-L-R),sy=y=>H-B-y/ym*(H-Tp-B),d=pts.map((p,i)=>(i?'L':'M')+sx(p.x).toFixed(1)+' '+sy(p.y).toFixed(1)).join('');let g='';for(let v=0;v<=ym;v+=10)g+=`<line class="gd" x1="${L}" x2="${W-R}" y1="${sy(v)}" y2="${sy(v)}"/><text x="${L-8}" y="${sy(v)+4}" text-anchor="end">${v}</text>`;

 `<div class="card"><div class="steps">${['Request','Import','Check','Report','Approve'].map((n,i)=>`<div class="step ${i<S?'done':i==S?'cur':''}"><u>${i<S?'&#10003;':i+1}</u>${n}</div>`).join('')}</div></div>
 <div class="card next"><div style="flex:1;min-width:260px"><h2 style="margin:0;font-size:22px">${nx[0]}</h2><p>${nx[1]}</p></div><div style="flex:1;min-width:260px;display:flex;justify-content:flex-end">${nx[2]}</div></div>
 <div class="grid"><div>${charts(j.data)}${fl.length?`<div class="card"><h2>Check results</h2><div style="display:flex;gap:8px;margin-bottom:10px"><span class="tag pass" style="padding:4px 12px">${c('pass')} passed</span><span class="tag warn" style="padding:4px 12px">${c('warn')} to review</span><span class="tag fail" style="padding:4px 12px">${c('fail')} failed</span></div>

 ${S>=3?`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div><h2 style="margin:0">Report preview</h2>${rp?`<span class="note">Version ${rp.version}, fingerprint ${rp.sha256.slice(0,12)}&hellip; <a class="lk" style="padding:0" href="/verify/${rp.token}" target="_blank">Verify</a></span>`:''}</div><div style="display:flex;gap:8px"><button class="btn g s" style="color:var(--er)" onclick="discard(${id})">Delete report</button><a class="btn g s" href="/api/jobs/${id}/report.pdf" target="_blank">Print</a><a class="btn g s" href="/api/jobs/${id}/report.pdf?dl=1">Download</a></div></div><iframe src="/api/jobs/${id}/report.pdf" title="Report preview"></iframe></div>`:''}</div>
 <div><div class="card"><h2>Sources (${have.filter(k=>k!='ids').length} of 10)</h2>${Object.entries(all).map(([k,l])=>`<div class="src ${have.includes(k)?'':'no'}"><span>${l}</span><span style="white-space:nowrap">${have.includes(k)?'<span class="tick">&#10003;</span>':'Missing'}<button class="lk" onclick="editSec(${id},'${k}')">${have.includes(k)?'Edit':'Enter'}</button></span></div>`).join('')}<div class="src"><span>Identifiers on each sheet</span><span><button class="lk" onclick="editSec(${id},'ids')">${have.includes('ids')?'Edit':'Enter'}</button></span></div>
  <br><button class="btn g" style="width:100%;justify-content:center" onclick="pick(ACC,f=>sendFile(${id},f))">Import data file or scan</button><p class="note">Download this job's data: <a class="lk" style="padding:0" href="/api/jobs/${id}/export/csv">CSV</a><a class="lk" href="/api/jobs/${id}/export/xlsx">Excel</a><a class="lk" href="/api/jobs/${id}/export/sqlite">Database</a><a class="lk" href="/api/jobs/${id}/export/json">JSON</a><br>Blank layout: <a class="lk" style="padding:0" href="/api/template/csv">CSV template</a><a class="lk" href="/api/template/xlsx">Excel template</a></p>${S>=1?`<br><button class="btn g" style="width:100%;justify-content:center" onclick="act('validate','Checks complete')">Run checks again</button>`:''}</div>
 <div class="card"><h2>Source documents (${j.sources.length})</h2>${j.sources.map(s=>`<div class="src"><span><a class="lk" style="padding:0" href="/api/sources/${s.id}" target="_blank" title="SHA-256 ${s.sha256}">${esc(s.filename)}</a></span><span style="white-space:nowrap"><button class="lk" onclick="readAI(${id},${s.id},this.dataset.fn)" data-fn="${esc(s.filename)}">Read with AI</button><button class="lk d" onclick="delSrc(${id},${s.id})">Remove</button></span></div>`).join('')||'<p class="note" style="margin:0">Attach the scanned or photographed sheets (PDF or image). They are kept with the record as evidence and can be read with AI.</p>'}</div>

 ${B(20,20,220,60,'Customer request form')}${B(20,100,220,60,'Lab log sheets (scans)')}${B(20,180,220,60,'Spreadsheets, CSV, databases')}${B(20,260,220,60,'Proforma / work instr.')}
 ${[50,130,210,290].map(y=>A(240,y,332,y<170?168:y<250?188:196)).join('')}
 ${B(340,150,220,70,'Ingestion','CSV, Excel, SQLite, JSON, AI scans')}${B(340,270,220,56,'Dedup / versioning','SHA-256 + audit trail')}${A(450,220,450,268)}
 ${A(560,185,660,185)}${B(660,150,190,70,'Validation engine','maths, limits, ID checks')}${B(660,270,190,56,'Database (SQL)','SQLite','gr')}${A(755,220,755,268)}
 ${A(850,185,930,185)}${B(930,150,150,70,'Report engine','PDF, versions, QR')}${A(850,298,930,298)}${B(930,270,150,56,'Dashboard','search + export')}${A(1005,220,1005,268)}
 <text class="sm" x="20" y="365">Prototype: browser app + Flask API + SQLite + ReportLab PDF + optional Gemini reader.  Production: PostgreSQL, user accounts, HTTPS hosting.</text></svg></div>

function modal(h){closeModal();const o=document.createElement('div');o.className='ov';o.id='ov';o.innerHTML=`<div class="md" role="dialog" aria-modal="true">${h}</div>`;o.onclick=e=>{if(e.target==o)closeModal()};document.body.append(o)}

async function delJob(id,back){const j=await api('/api/jobs/'+id);modal(`<h2>Delete this record?</h2><p><b>${esc(j.series)}</b> (${esc(j.customer)}) will be permanently removed with its imported data, generated report and history. This cannot be undone.</p><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px"><button class="btn g" onclick="closeModal()">Cancel</button><button class="btn d" id="dl">Delete record</button></div>`);

function anim(){document.querySelectorAll('[data-n]:not([data-x])').forEach(e=>{e.dataset.x=1;const n=+e.dataset.n,d=+(e.dataset.d||0),t0=performance.now(),f=t=>{const p=Math.min(1,(t-t0)/900);e.textContent=(n*(1-Math.pow(1-p,3))).toFixed(d)+(e.dataset.s||'');if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)});

route();
