function modal(h){closeModal();const o=document.createElement('div');o.className='ov';o.id='ov';o.innerHTML=`<div class="md" role="dialog" aria-modal="true">${h}</div>`;o.onclick=e=>{if(e.target==o)closeModal()};document.body.append(o)}
function closeModal(){const o=$('#ov');if(o)o.remove()}addEventListener('keydown',e=>{if(e.key=='Escape')closeModal()});
async function editJob(id){const j=await api('/api/jobs/'+id),r=j.data.request||{},v={series:j.series,sample:j.sample,customer:j.customer,rating:j.rating,address:r.address,serial:r.serial,tests:r.tests,criteria:r.criteria,witness:r.witness,conformity:r.conformity};
 const L={series:'Test series number',sample:'Sample code',customer:'Customer name',rating:'Rating',address:'Customer address',serial:'Serial number',tests:'Tests requested',criteria:'Standard',witness:'Witness',conformity:'Statement of conformity'};
 modal(`<h2>Edit record</h2><div class="form">${Object.keys(L).map(k=>`<div class="${k=='address'?'w':''}"><label for="e_${k}">${L[k]}</label><input id="e_${k}" value="${esc(v[k])}"></div>`).join('')}</div>${j.stage>=3?`<p style="font-size:14px;margin-top:14px">This report is already generated. Saving updates it${j.stage==4?' and sends it back for re-approval':''}.</p>`:''}<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px"><button class="btn g" onclick="closeModal()">Cancel</button><button class="btn" id="es">Save changes</button></div>`);
 $('#es').onclick=async()=>{const b={};Object.keys(L).forEach(k=>b[k]=$('#e_'+k).value.trim());try{await api(`/api/jobs/${id}/edit`,b);closeModal();toast('Record updated');route()}catch(e){toast(e,1)}}}
async function delJob(id,back){const j=await api('/api/jobs/'+id);modal(`<h2>Delete this record?</h2><p><b>${esc(j.series)}</b> (${esc(j.customer)}) will be permanently removed with its imported data, generated report and history. This cannot be undone.</p><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px"><button class="btn g" onclick="closeModal()">Cancel</button><button class="btn d" id="dl">Delete record</button></div>`);
 $('#dl').onclick=async()=>{try{await api('/api/jobs/'+id,undefined,'DELETE');closeModal();toast('Record deleted');back?go('records'):route()}catch(e){toast(e,1)}}}
async function discard(id){modal(`<h2>Delete the generated report?</h2><p>The record and its imported data are kept. You can generate the report again at any time.</p><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px"><button class="btn g" onclick="closeModal()">Cancel</button><button class="btn d" id="dr">Delete report</button></div>`);
 $('#dr').onclick=async()=>{try{await api(`/api/jobs/${id}/discard`,{});closeModal();toast('Report deleted');route()}catch(e){toast(e,1)}}}
function anim(){document.querySelectorAll('[data-n]:not([data-x])').forEach(e=>{e.dataset.x=1;const n=+e.dataset.n,d=+(e.dataset.d||0),t0=performance.now(),f=t=>{const p=Math.min(1,(t-t0)/900);e.textContent=(n*(1-Math.pow(1-p,3))).toFixed(d)+(e.dataset.s||'');if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)});
 document.querySelectorAll('[data-w]:not([data-x])').forEach(e=>{e.dataset.x=1;requestAnimationFrame(()=>requestAnimationFrame(()=>{e.style.width=e.dataset.w+'%'}))});
 document.querySelectorAll('.rf[data-p]:not([data-x])').forEach(e=>{e.dataset.x=1;requestAnimationFrame(()=>requestAnimationFrame(()=>{e.style.strokeDashoffset=226.2*(1-e.dataset.p/100)}))})}
new MutationObserver(anim).observe($('#app'),{childList:true});
route();
</script>
